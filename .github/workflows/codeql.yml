# For most projects, this workflow file will not need changing; simply commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '24 3 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The Android Gradle plugin in this repo requires JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # This repo ships gradle-wrapper.properties but no gradlew script or
      # wrapper jar, so setup-gradle provides the `gradle` executable.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The repo's build signs both debug and release with keystores that are
      # gitignored (see .gitignore) and only available as CI secrets, so a
      # fresh checkout cannot package an APK. CodeQL only needs to *compile*
      # the sources, so we build the debug variant only; CodeQL traces that
      # build to construct its database.
      - name: Generate debug keystore
        run: |
          keytool -genkey -v -keystore debug.keystore \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # If you wish to specify custom queries, you can do so here.
          # queries: security-extended,security-and-quality
          # Manual: the repo's release signing keystore is gitignored and only
          # available as a CI secret, so CodeQL's autobuild (which runs
          # `gradlew clean` and packages both variants) always fails on a fresh
          # checkout. We build the debug variant ourselves below; CodeQL traces
          # that build to construct its database.
          build-mode: manual

      - name: Build debug variant (traced by CodeQL)
        run: gradle --no-daemon assembleDebug -Dorg.gradle.dependency.verification=off

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
